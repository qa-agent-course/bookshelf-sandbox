<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout - Bookshelf</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app-config.js"></script>
  <script src="/app.js" defer></script>
</head>
<body data-page="checkout">
  <header id="site-header" class="site-header"><a class="logo" href="/">Bookshelf</a></header>
  <main id="main">
    <h1 data-i18n="checkout.title">Checkout</h1>
    <div class="checkout">
      <form id="checkout-form" class="checkout-form" novalidate>
        <div class="field">
          <label for="fullName" data-i18n="checkout.fullName">Full name</label>
          <input id="fullName" name="fullName" autocomplete="name">
        </div>
        <div class="field">
          <input id="email" name="email" type="email" autocomplete="email" placeholder="Email" data-i18n-placeholder="checkout.email">
        </div>
        <div class="field">
          <label for="street" data-i18n="checkout.street">Street</label>
          <input id="street" name="street" autocomplete="street-address">
        </div>
        <div class="field">
          <label for="city" data-i18n="checkout.city">City</label>
          <input id="city" name="city" autocomplete="address-level2">
        </div>
        <div class="field">
          <input id="postcode" name="postcode" autocomplete="postal-code" placeholder="Postcode" data-i18n-placeholder="checkout.postcode">
        </div>
        <fieldset class="field">
          <legend data-i18n="checkout.deliveryOption">Delivery option</legend>
          <label><input type="radio" name="deliveryOption" value="standard" checked> <span data-i18n="checkout.standard">Standard delivery</span></label>
          <label><input type="radio" name="deliveryOption" value="pickup"> <span data-i18n="checkout.pickup">Pickup point</span></label>
        </fieldset>
        <p id="form-error" class="error-text" role="alert"></p>
        <button id="place-order" type="submit" data-i18n="checkout.placeOrder">Place order</button>
      </form>
      <aside class="summary">
        <h2 data-i18n="checkout.summary">Order summary</h2>
        <div id="summary"></div>
      </aside>
    </div>
  </main>
  <footer class="site-footer"><p data-i18n="app.tagline">A training bookshop. Fake data only.</p></footer>
</body>
</html>
